name: Deploy Russian Arabic Kids app
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arabic-kids-russian
    paths:
      - 'kids-arabic-russian/**'
      - '.github/workflows/deploy-kids-arabic-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kids-arabic-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: node --check kids-arabic-russian/app.js
      - name: Validate lesson data
        run: node kids-arabic-russian/tests/data-check.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: kids-arabic-russian
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
