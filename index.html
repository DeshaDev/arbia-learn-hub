function dictionary(){var q=(s.search||"").trim().toLowerCase();var list=VOCAB.filter(function(w){return (w.ar+" "+w.meaning+" "+w.pron+" "+w.context).toLowerCase().indexOf(q)>=0;});return layout('<div class="page-head"><div><div class="eyebrow">ЛИЧНЫЙ СЛОВАРЬ</div><h1>Слова в контексте</h1><p>Нажми на карточку, чтобы открыть значение и увидеть выражение, в котором встречается слово. Перевод может меняться в зависимости от контекста.</p></div></div><div class="search-row"><label class="searchbox"><span class="sr-only">Поиск слов</span><input id="dictionary-search" type="search" value="'+esc(s.search||"")+'" placeholder="Найти слово или перевод…"></label><span class="tag">'+list.length+' слов</span></div><div class="dictionary" id="dictionary-grid">'+(list.length?list.map(dictCard).join(""):'<div class="empty">Таких слов не найдено. Попробуй другой запрос.</div>')+'</div><p class="disclaimer">Словарь — учебная подборка, а не полный лексический или тафсирный справочник. Значения приведены как ориентир для указанного контекста.</p>');}
function dictCard(w){return '<button class="dict-card" data-action="dict-open" data-id="'+w.id+'" aria-expanded="'+(s.dictOpen===w.id)+'"><span class="dict-top"><span class="tag">'+(w.index<=4?"БАСМАЛА":"АЛЬ-ФАТИХА")+'</span><span class="dict-index">'+String(w.index).padStart(2,"0")+'</span></span><span class="dict-ar" lang="ar" dir="rtl">'+w.ar+'</span><span class="dict-pron">'+w.pron+'</span>'+(s.dictOpen===w.id?'<div class="dict-meaning">'+w.meaning+'</div><div class="dict-context"><span class="arabic" lang="ar" dir="rtl">'+w.context+'</span><br>'+esc(w.note)+'</div>':'<div class="dict-hint">Нажми, чтобы открыть значение ↗</div>')+'</button>';}
function path(){return layout('<div class="page-head"><div><div class="eyebrow">ТВОЙ МАРШРУТ</div><h1>От первого слова — к пониманию</h1><p>Постепенный подход: узнавать ключевые слова, видеть их в аятах и понемногу замечать, как устроен арабский язык.</p></div></div><div class="path-grid"><article class="path-card current"><span class="path-icon">١</span><div><span class="side-label">НАЧАЛО · ДОСТУПЕН</span><h3>Басмала: слово за словом</h3><p>Четыре слова, общий смысл выражения и первая грамматическая подсказка.</p><span class="path-status">'+(s.lessonDone?"✓ Завершён":"● Доступен сейчас")+'</span><button class="btn primary" style="margin-top:11px" data-nav="lesson">'+(s.lessonDone?"Посмотреть итог":"Начать урок")+' →</button></div></article><article class="path-card"><span class="path-icon">٢</span><div><span class="side-label">СЛЕДУЮЩИЙ ЭТАП</span><h3>الْحَمْدُ لِلَّهِ</h3><p>Хвала Аллаху. Узнай значения слов الْحَمْدُ، لِلَّهِ и رَبِّ в следующем выражении.</p><span class="path-status">План учебной программы</span></div></article><article class="path-card"><span class="path-icon">٣</span><div><span class="side-label">ПОСЛЕДОВАТЕЛЬНОСТЬ</span><h3>إِيَّاكَ نَعْبُدُ</h3><p>Понимай, как выражают обращение и значение «мы поклоняемся».</p><span class="path-status">План учебной программы</span></div></article><article class="path-card"><span class="path-icon">٤</span><div><span class="side-label">СЛОВА И КОРНИ</span><h3>اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ</h3><p>Собери выражение «Веди нас прямым путём» и начни замечать связи между словами.</p><span class="path-status">План учебной программы</span></div></article></div><p class="disclaimer">Интерактивно реализован первый урок и словарь. Остальные карточки показывают направление программы и пока не являются доступными уроками.</p>');}
function render(){var a=document.getElementById("app");a.innerHTML=s.view==="lesson"?lesson():s.view==="complete"?complete():s.view==="dictionary"?dictionary():s.view==="path"?path():home();navUpdate();persist();}
function go(view){s.view=view;if(view==="lesson"&&s.lessonDone&&s.step>3)s.step=4;render();window.scrollTo({top:0,behavior:"smooth"});}
document.addEventListener("click",function(e){var n=e.target.closest("[data-nav]");if(n){e.preventDefault();go(n.dataset.nav);return;}var b=e.target.closest("[data-action]");if(!b)return;var a=b.dataset.action;
if(a==="word"){s.selected=b.dataset.id;if(s.seen.indexOf(s.selected)<0)s.seen.push(s.selected);render();}
else if(a==="next"){if(s.step===0&&s.seen.length===4){s.step=1;s.answer=null;}else if(s.step===1&&s.answer===0){s.step=2;s.match=null;}else if(s.step===2&&s.match===0){s.step=3;s.grammar=null;}render();}
else if(a==="meaning-answer"){s.answer=Number(b.dataset.value);render();}
else if(a==="match-answer"){s.match=Number(b.dataset.value);render();}
else if(a==="grammar-answer"){s.grammar=Number(b.dataset.value);render();}
else if(a==="finish"&&s.grammar===0){if(!s.lessonDone)s.xp+=20;s.lessonDone=true;s.step=4;s.view="complete";persist();render();window.scrollTo({top:0,behavior:"smooth"});}
else if(a==="dict-open"){s.dictOpen=s.dictOpen===b.dataset.id?"":b.dataset.id;render();}
else if(a==="replay"){s.view="lesson";s.step=0;s.selected=null;s.seen=[];s.answer=null;s.match=null;s.grammar=null;render();window.scrollTo({top:0,behavior:"smooth"});}
});
document.addEventListener("input",function(e){if(e.target.id!=="dictionary-search")return;s.search=e.target.value;var grid=document.getElementById("dictionary-grid");if(!grid)return;var q=s.search.trim().toLowerCase();var list=VOCAB.filter(function(w){return (w.ar+" "+w.meaning+" "+w.pron+" "+w.context).toLowerCase().indexOf(q)>=0;});grid.innerHTML=list.length?list.map(dictCard).join(""):'<div class="empty">Таких слов не найдено. Попробуй другой запрос.</div>';persist();});
render();
</script>
</body></html>
