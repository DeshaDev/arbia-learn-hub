<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7ff">
  <meta name="description" content="Интерактивное путешествие по арабскому языку для русскоязычных детей. Буквы, слова, игры, голосовые задания и награды вместе с зайчиком Али.">
  <title>Али и арабский мир — учим арабский играя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#home" data-route="home" aria-label="Али и арабский мир — главная">
      <span class="brand-symbol"><span class="arabic" lang="ar" dir="rtl">ع</span><i>✦</i></span>
      <span class="brand-label"><strong>Али и арабский мир</strong><small>Учимся играя</small></span>
    </a>
    <nav class="main-nav" aria-label="Навигация">
      <button class="nav-link" data-route="path"><span>🗺</span>Моя карта</button>
    </nav>
    <div class="top-actions">
      <div class="xp-chip" title="Собранные звёздочки"><span>⭐</span><b id="xp-count">0</b><small>звёзд</small></div>
      <button id="sound-toggle" class="icon-button" aria-label="Включить или выключить звук">🔊</button>
    </div>
    <button class="mobile-menu" id="mobile-menu" aria-label="Открыть меню">☰</button>
  </header>
  <div class="mobile-nav" id="mobile-nav">
    <button data-route="home">Главная</button><button data-route="path">Мой путь</button><button data-route="letters">Буквы</button><button data-route="reading">Читаем</button><button data-route="words">Слова</button><button data-route="phrases">Фразы</button><button data-route="games">Игры</button><button data-route="profile">Мой профиль</button>
  </div>
  <main id="app" tabindex="-1">
    <div class="boot-screen"><img src="./assets/rabbit.svg" alt=""><strong>Али готовит твоё приключение…</strong><span class="loading-track"><i></i></span></div>
  </main>
  <footer class="site-footer">
    <div class="footer-brand"><span class="brand-symbol small-symbol"><span class="arabic" lang="ar" dir="rtl">ع</span><i>✦</i></span><span><b>Али и арабский мир</b><small>Маленькие шаги — большие открытия.</small></span></div>
    <div class="footer-links"><button data-route="path">Учебный путь</button><button data-route="profile">Мои достижения</button><button id="about-button">Для родителей</button></div>
    <small class="copyright">Учимся с любопытством ♡</small>
  </footer>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
